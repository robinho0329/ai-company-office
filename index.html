<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제조 데이터 분석팀 오피스</title>
<style>
  /* ── 전체 레이아웃 ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#20242e; color:#e8e6e0; font-family:'Malgun Gothic','Segoe UI',sans-serif; overflow:hidden; }
  #app { display:flex; height:100vh; }
  #officeWrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; min-width:0; }
  #office { background:#2a2e3a; border-radius:8px; max-width:100%; max-height:100%; }
  /* ── 우측 패널 ── */
  #panel { width:360px; background:#282c38; border-left:1px solid #3a3f4e; display:flex; flex-direction:column; overflow:hidden; }
  .sec { padding:10px 14px; border-bottom:1px solid #3a3f4e; }
  .sec h3 { font-size:12px; color:#9aa3b5; margin-bottom:6px; letter-spacing:1px; }
  #clock { font-size:20px; font-weight:bold; color:#f2c94c; }
  #dayLabel { font-size:12px; color:#9aa3b5; margin-left:8px; }
  #modeLabel { font-size:11px; color:#20242e; background:#84a59d; border-radius:4px;
               padding:2px 7px; margin-left:8px; }
  /* 상태 요약 */
  #stateSummary { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; }
  #planSrc { margin-top:7px; font-size:11px; padding:3px 7px; border-radius:4px; }
  .srcReal { background:#1f3d33; color:#3ecfae; border:1px solid #2a6b56; }
  .srcDemo { background:#3a3626; color:#e0c14a; border:1px solid #6b5e2a; }
  .stDot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; border:1px solid #555; }
  /* 시나리오 단계 */
  #stepList { font-size:11.5px; line-height:1.75; max-height:170px; overflow-y:auto;
              transition:max-height .2s; }
  body.gate #stepList { max-height:88px; }   /* 승인 대기 중엔 접어서 버튼 자리를 만든다 */
  .step { color:#6c7385; }
  .step.now { color:#f2c94c; font-weight:bold; }
  .step.done { color:#3ecfae; }
  /* 컨트롤 */
  .btnRow { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  button { background:#3a4155; color:#e8e6e0; border:1px solid #4a526a; border-radius:6px;
           padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
  button:hover:not(:disabled) { background:#4a526a; }
  button:disabled { opacity:.4; cursor:default; }
  button.speedOn { background:#f2c94c; color:#222; border-color:#f2c94c; }
  /* 승인 패널 */
  #approvalBox { display:none; background:#3d2436; border:1px solid #e0407a; border-radius:8px; padding:10px; margin-top:8px; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(224,64,122,.5);} 50%{box-shadow:0 0 0 6px rgba(224,64,122,0);} }
  #approvalBox p { font-size:12px; margin-bottom:8px; }
  /* 카드가 3장이면 박스가 패널 밖으로 밀려 버튼이 잘린다.
     카드 영역만 스크롤시키고 버튼은 항상 박스 안에 남긴다. */
  #approvalBox.show { display:flex; flex-direction:column; max-height:44vh;
                      animation:pulse 1.4s infinite; }
  #approvalTitle { font-size:12px; margin-bottom:8px; flex:0 0 auto; }
  #approvalChoices { display:flex; flex-direction:column; gap:5px;
                     overflow-y:auto; min-height:0; flex:1 1 auto; }
  #approvalBtns { flex:0 0 auto; }
  .choice { border:1px solid #4a526a; border-radius:6px; padding:6px 8px; cursor:pointer;
            font-size:11.5px; line-height:1.5; background:#332a3d; }
  .choice:hover { border-color:#7a6a8a; }
  .choice.sel { border-color:#f2c94c; background:#3f3547; }
  .choice b { color:#f2c94c; }
  .choice span { color:#a89ab5; }
  .choice .doWhat { color:#7fd6b8; }
  #btnApprove, .btnOk { background:#2a9d6f; border-color:#2a9d6f; }
  #btnRevise { background:#c98a2a; border-color:#c98a2a; }
  #btnDiscard { background:#a04040; border-color:#a04040; }
  /* 지시창 */
  #cmdSec { flex:1; display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; font-size:12px; line-height:1.55; padding:4px 0; }
  .msg { margin-bottom:7px; }
  .msg .who { font-weight:bold; margin-right:5px; }
  .msg.me .who { color:#f2c94c; }
  .msg pre { white-space:pre-wrap; font-family:inherit; background:#20242e; border-radius:6px; padding:6px 8px; margin-top:3px; font-size:11.5px; }
  #quickBtns { display:flex; gap:5px; flex-wrap:wrap; margin:6px 0; }
  #quickBtns button { font-size:11px; padding:4px 8px; }
  #cmdRow { display:flex; gap:6px; }
  #cmdInput { flex:1; background:#20242e; border:1px solid #4a526a; border-radius:6px; color:#e8e6e0;
              padding:7px 10px; font-size:12.5px; font-family:inherit; }
  #cmdInput:focus { outline:none; border-color:#f2c94c; }
</style>
</head>
<body>
<div id="app">
  <div id="officeWrap"><canvas id="office" width="1098" height="612"></canvas></div>
  <div id="panel">
    <div class="sec">
      <span id="clock">--:--</span><span id="dayLabel">출근 전</span><span id="modeLabel"></span>
      <div class="btnRow">
        <button id="btnStart">하루 시작</button>
        <button id="btnPause" disabled>일시정지</button>
        <button class="spd speedOn" data-s="1">1x</button>
        <button class="spd" data-s="2">2x</button>
        <button class="spd" data-s="4">4x</button>
      </div>
    </div>
    <div class="sec"><h3>직원 상태 34명</h3><div id="stateSummary"></div>
      <div id="planSrc" class="srcDemo">후보 출처: 확인 중…</div></div>
    <div class="sec"><h3>하루 시나리오 <span id="stepCount">12단계</span></h3><div id="stepList"></div>
      <div id="approvalBox">
        <p id="approvalTitle">★ 대표 승인 대기</p>
        <div id="approvalChoices"></div>
        <div id="approvalBtns" class="btnRow"></div>
      </div>
    </div>
    <div class="sec" id="cmdSec">
      <h3>대표 지시창</h3>
      <div id="log"></div>
      <div id="quickBtns">
        <button data-q="현황 보고">현황 보고</button>
        <button data-q="왜 막혔어?">왜 막혔어?</button>
        <button data-q="검수 소집">검수 소집</button>
        <button data-q="이 수치 어디서 나왔어?">수치 출처</button>
        <button data-q="그 한계 근거 대봐">한계 근거</button>
        <button data-q="집중 모드">집중 모드</button>
        <button data-q="모드 B로">모드 전환</button>
        <button data-q="후보 출처">후보 출처</button>
        <button data-q="대상 프로젝트">대상 프로젝트</button>
        <button data-q="저장소 목록">저장소 목록</button>
        <button data-q="지시서">지시서</button>
      </div>
      <div id="cmdRow">
        <input id="cmdInput" placeholder='예: "모델링팀 뭐해?" / "왜 막혔어?"'>
        <button id="btnSend">지시</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   제조 데이터 분석팀 오피스 — AI_COMPANY.md(mfg-anomaly-workflow) 사규 시각화
   34명(팀장13+팀원21) · 상태 5종 · 하루 12단계 · 대표 지시창
   규칙: ⑪ 대표 승인에서 반드시 멈춘다 / 회의 참석자는 자율 행동 금지
   ══════════════════════════════════════════════════════════ */
const TILE = 22, COLS = 61, ROWS = 34;
const cv = document.getElementById('office'), cx = cv.getContext('2d');
// 고DPI 대응 — 백킹스토어를 논리크기의 DPR배로 잡고 논리좌표로 그린다.
// DPR이 1인 환경에서도 최소 2배로 슈퍼샘플링해, 캔버스가 어떤 크기로 표시되든
// 확대가 아닌 축소가 일어나게 만든다(축소는 계단현상이 생기지 않는다).
const DPR = Math.max(2, Math.min(window.devicePixelRatio || 1, 3));
cv.width = COLS * TILE * DPR;  cv.height = ROWS * TILE * DPR;
cv.style.width = (COLS * TILE) + 'px';  cv.style.height = (ROWS * TILE) + 'px';
cx.scale(DPR, DPR);
cx.textBaseline = 'alphabetic';

/** 캔버스가 실제로 표시되는 배율. 1보다 작으면 축소돼 작은 글자가 뭉갠다. */
function dispScale() {
  return (cv.clientWidth || COLS * TILE) / (COLS * TILE);
}

/** 타일마다 결정적인 미세 밝기 편차 — 단색 바닥의 플라스틱한 느낌을 없앤다. */
function tileNoise(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return (h - Math.floor(h)) - 0.5;
}

/* ── 상태 5종 (사규 §8) ── */
const STATES = {

  // 신설 — 기획 전담. 산출물·이월 대장만 근거로 후보를 내고, 없는 과제를 지어내지 않는다.
  { name:'과제발굴팀',      short:'과제발굴', color:'#d98f5a' },

const ROSTER = [
  {n:'한지훈',c:'한요구',d:0,lead:1,buzz:'이 분석으로 뭘 결정하실 건가요?'},
  {n:'조은결',c:'조질문',d:0,lead:0,buzz:'질문이 2개인데요. 쪼갤까요?'},
  {n:'서민재',c:'서수집',d:1,lead:1,buzz:'스냅샷 시각부터 박아두겠습니다.'},
  {n:'신유빈',c:'신적재',d:1,lead:0,buzz:'총 적재 N행, 비율 나왔어요.'},
  {n:'하도윤',c:'하스냅',d:1,lead:0,buzz:'원본은 안 건드렸습니다. 복제본이에요.'},

  {n:'권나린',c:'권결측',d:2,lead:0,buzz:'이 태그 상한에 붙박이예요. 포화입니다.'},

  {n:'배준혁',c:'배피처',d:4,lead:1,buzz:'이 피처 물리적 의미 한 줄로 말해보세요.'},
  {n:'류하진',c:'류누수',d:4,lead:0,buzz:'미래 정보 들어갔습니다. 반려요.'},

  {n:'심재윤',c:'심기준',d:5,lead:0,buzz:'단순 임계가 이 정도 나와요. 이거보다 나은가요?'},
  {n:'표지안',c:'표학습',d:5,lead:0,buzz:'random_state=42 확인했습니다.'},
  {n:'최시온',c:'최검증',d:6,lead:1,buzz:'무작위 분할이면 여기서 반려입니다.'},

  {n:'봉재희',c:'봉태그',d:8,lead:0,buzz:'xmeas 몇 번인지 안 적혀 있어요.'},
  {n:'설우빈',c:'설비용',d:8,lead:0,buzz:'미탐 N건이면 출동 몇 번인가요?'},
  {n:'오다현',c:'오문체',d:9,lead:1,buzz:"'우수한'은 수치가 아니에요."},

  {n:'예지완',c:'예발굴',d:12,lead:1,buzz:'그거 어느 파일에 적혀 있습니까?'},

/* ── 지도 ── */
const walk = Array.from({length:ROWS},()=>Array(COLS).fill(true));
const tint = Array.from({length:ROWS},()=>Array(COLS).fill('cor')); // 바닥 색 구역
const furn = []; // {x,y,kind}
function W(x,y){ if(y>=0&&y<ROWS&&x>=0&&x<COLS) walk[y][x]=false; }
function buildMap(){
  for(let x=0;x<COLS;x++){ W(x,0); W(x,33); }
  for(let y=0;y<ROWS;y++){ W(0,y); W(60,y); }
  walk[22][0]=true; walk[23][0]=true;                    // 출입구 (좌측 벽 개구부)
  const doors=[5,15,25,35,45,55];
  for(const vx of [10,20,30,40,50]){ for(let y=1;y<=9;y++) W(vx,y); for(let y=24;y<=32;y++) W(vx,y); }
  for(let x=1;x<=59;x++){ if(!doors.includes(x)) W(x,9); if(!doors.includes(x)) W(x,24); }
  // 라운지 x0..14 / 회의실 x20..40 / 대표실 x46..60 (y12..21)
  for(let x=1;x<=14;x++){ if(x!==7) W(x,12); if(x!==7) W(x,21); }
  for(let y=12;y<=21;y++) W(14,y);
  for(let y=12;y<=21;y++){ W(20,y); W(40,y); }
  // 과제발굴팀 방(x15~19, y13~20) — 위/아래를 막고 아래쪽 x17에 문 하나
  for(let x=15;x<=19;x++){ W(x,12); if(x!==17) W(x,21); }
  for(let x=21;x<=39;x++){ if(x!==30) W(x,12); if(x!==30) W(x,21); }
  for(let y=12;y<=21;y++){ if(y!==16&&y!==17) W(46,y); }
  for(let x=47;x<=59;x++){ W(x,12); W(x,21); }
  // 바닥 구역 색
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(y>=1&&y<=8) tint[y][x]='room';
    if(y>=25&&y<=32) tint[y][x]='room';
    if(y>=13&&y<=20){ if(x>=1&&x<=13) tint[y][x]='lounge'; if(x>=21&&x<=39) tint[y][x]='meet'; if(x>=47&&x<=59) tint[y][x]='ceo';
      if(x>=15&&x<=19) tint[y][x]='room'; }
  }
  // 가구
  furn.push({x:27,y:16,k:'table'},{x:28,y:16,k:'table'},{x:29,y:16,k:'table'},{x:30,y:16,k:'table'},
            {x:31,y:16,k:'table'},{x:32,y:16,k:'table'},{x:33,y:16,k:'table'},
            {x:27,y:17,k:'table'},{x:28,y:17,k:'table'},{x:29,y:17,k:'table'},{x:30,y:17,k:'table'},
            {x:31,y:17,k:'table'},{x:32,y:17,k:'table'},{x:33,y:17,k:'table'});
  furn.push({x:2,y:13,k:'coffee'},{x:3,y:13,k:'coffee'},{x:12,y:13,k:'plant'},{x:2,y:20,k:'plant'});
  furn.push({x:53,y:16,k:'desk'},{x:48,y:13,k:'plant'},{x:58,y:13,k:'plant'});
  for(const f of furn) W(f.x,f.y);
}
/* 부서 방 좌표: 0~5 상단, 6~11 하단 */
const DISCOVERY_ROOM = { wx:15, door:{x:17,y:21}, label:{x:17,y:16.4} };
function roomOf(d){
  if(d===12) return { ...DISCOVERY_ROOM, top:true };   // 중앙 밴드 특례
  const top=d<6, j=top?d:d-6, wx=j*10;
  return { wx, top, door:{x:wx+5,y:top?9:24}, label:{x:wx+5,y:top?6.6:27.4} }; }
function deskSpots(d,count){
  if(d===12) return [{desk:{x:16,y:14},chair:{x:16,y:15}},{desk:{x:18,y:14},chair:{x:18,y:15}}];
  const r=roomOf(d), dy=r.top?2:31, cy=r.top?3:30;
  const xs = count===3? [r.wx+2,r.wx+5,r.wx+8] : [r.wx+3,r.wx+7];
  return xs.map(x=>({desk:{x,y:dy}, chair:{x,y:cy}})); }
const MEET_SEATS=[{x:28,y:15},{x:30,y:15},{x:32,y:15},{x:28,y:18},{x:30,y:18},{x:32,y:18}];
const LOUNGE_SPOTS=[{x:2,y:15},{x:4,y:14},{x:6,y:15},{x:9,y:14},{x:5,y:18},{x:8,y:17}];
const CEO_SPOT={x:53,y:17}, BRIEF_SPOT={x:51,y:17}, ENTRY={x:0,y:23};

/* ── 직원 ── */
const emps=[];
function buildEmps(){
  const perDept={};
  for(const r of ROSTER){ (perDept[r.d]=perDept[r.d]||[]).push(r); }
  for(let d=0;d<DEPTS.length;d++){ const list=perDept[d], spots=deskSpots(d,list.length);
    list.forEach((r,i)=>{ emps.push({ ...r, id:emps.length, dept:d,
      desk:spots[i].desk, chair:spots[i].chair,
      x:ENTRY.x, y:ENTRY.y, path:[], seg:0, state:'대기', onsite:false, sitting:false,
      inMeeting:false, wandering:false, recall:false, bubble:null, resolver:null, goal:null, stuck:0 }); });
  }
}
const E = name => emps.find(e=>e.n===name);
const deptEmps = d => emps.filter(e=>e.dept===d);

/* ── A* (4방향 · 서 있는 직원 칸 우회) ── */
function occupiedSet(self){ const s=new Set();
  for(const e of emps){ if(e!==self && e.onsite && e.path.length===0) s.add(e.x+','+e.y); } return s; }
function astar(sx,sy,gx,gy,occ){
  if(sx===gx&&sy===gy) return [];
  const key=(x,y)=>x+','+y, open=[{x:sx,y:sy,g:0,f:0,p:null}], seen=new Map();
  seen.set(key(sx,sy),0);
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i].f<open[bi].f) bi=i;
    const cur=open.splice(bi,1)[0];
    if(cur.x===gx&&cur.y===gy){ const path=[]; let n=cur; while(n.p){ path.unshift({x:n.x,y:n.y}); n=n.p; } return path; }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||!walk[ny][nx]) continue;
      const k=key(nx,ny);
      if(occ.has(k)&&!(nx===gx&&ny===gy)) continue;
      const g=cur.g+1;
      if(seen.has(k)&&seen.get(k)<=g) continue;
      seen.set(k,g);
      open.push({x:nx,y:ny,g,f:g+Math.abs(gx-nx)+Math.abs(gy-ny),p:cur});
    }
  }
  return null;
}
function walkTo(e,tx,ty){
  return new Promise(res=>{ e.goal={x:tx,y:ty}; e.resolver=res; e.sitting=false; e.stuck=0;
    const p=astar(e.x,e.y,tx,ty,occupiedSet(e)); e.path=p||[]; e.seg=0; });
}

/* ── 시간·속도·대기 ── */
let speed=1, paused=false, dayStarted=false, dayDone=false;
let simMin=9*60, curStep=-1;
// 승인 게이트 — ⑪ 전용 하드코딩을 걷어내고 문맥을 객체 하나에 담는다.
// {cfg, resolve, since, pick}. 열려 있으면 non-null.
let approvalGate=null;
// 하루 세대 토큰 — 리셋 후에도 이전 날의 코루틴이 살아 움직이는 것을 막는다.
let dayEpoch=0;
let decisions=[];  // [{title, action}] — 브리핑 집계 근거
let dataWaitMsg=null, rejectCount=0, decisionMade=null;
const pendWaits=[];
const wait=ms=>new Promise(res=>pendWaits.push({left:ms,res}));
async function say(e,text,ms=2600){ e.bubble={text,until:Infinity}; await wait(ms); e.bubble=null; }
function flash(e,text,ms=2600){ e.bubble={text,until:performance.now()+ms/Math.max(speed,1)*1}; } // 즉발 말풍선

/* ── 이동 갱신 ── */
function updateEmps(dt){
  const spd=3.2*speed;
  for(const e of emps){
    if(e.bubble && e.bubble.until!==Infinity && performance.now()>e.bubble.until) e.bubble=null;
    if(!e.goal) continue;
    if(e.path===null||e.path.length===0){
      if(e.x===e.goal.x&&e.y===e.goal.y){ const r=e.resolver; e.goal=null; e.resolver=null;
        if(e.chair&&e.x===e.chair.x&&e.y===e.chair.y) e.sitting=true;
        if(r) r(); continue; }
      e.stuck+=dt;
      if(e.stuck>0.4){ e.stuck=0; const p=astar(e.x,e.y,e.goal.x,e.goal.y,occupiedSet(e));
        if(p) e.path=p; else if((e.stuckTotal=(e.stuckTotal||0)+1)>25){ e.x=e.goal.x; e.y=e.goal.y; e.path=[]; e.stuckTotal=0; } }
      continue;
    }
    const nxt=e.path[0];
    const blocked=emps.some(o=>o!==e&&o.onsite&&o.path.length===0&&o.x===nxt.x&&o.y===nxt.y);
    if(blocked){
      // 좁은 문에서 서로 막히면 매 프레임 경로만 다시 계산하며 영원히 못 간다.
      // 카운터 없이 continue 하면 라이브락이고, 그 위에서 await 하던 코루틴이 통째로 멈춘다.
      e.blockT=(e.blockT||0)+dt;
      if(e.blockT<1.2){                                    // ① 잠깐 기다렸다 우회로 탐색
        const p=astar(e.x,e.y,e.goal.x,e.goal.y,occupiedSet(e));
        if(p&&p.length){ e.path=p; e.seg=0; continue; }
      }
      if(e.blockT<3.0) continue;                           // ② 우회로가 없으면 제자리 대기
      if(e.blockT<5.0){                                    // ③ 점유를 무시하고 직진 경로
        const p=astar(e.x,e.y,e.goal.x,e.goal.y,new Set());
        if(p&&p.length){ e.path=p; e.seg=0; e.blockT=0; continue; }
      }
      e.x=e.goal.x; e.y=e.goal.y; e.path=[]; e.blockT=0;   // ④ 최후 — 목적지로 보낸다
      continue;
    }
    e.blockT=0;
    e.seg+=spd*dt;
    if(e.seg>=1){ e.x=nxt.x; e.y=nxt.y; e.path.shift(); e.seg=0; }
  }
}
/* 라운지 자율 행동 — 회의 참석자·근무 중 직원 금지 (2차 시도 실패 교훈) */
function wanderAI(dt){
  if(!dayStarted||dayDone) return;
  const now=emps.filter(e=>e.wandering).length;
  for(const e of emps){
    if(e.wandering&&e.recall) continue;
    if(now>=3) break;
    if(e.state!=='대기'||e.inMeeting||e.wandering||!e.onsite||e.goal) continue;
    if(Math.random()<dt*0.006) startWander(e);
  }
}
async function startWander(e){
  e.wandering=true;
  const spot=LOUNGE_SPOTS[Math.floor(Math.random()*LOUNGE_SPOTS.length)];
  await walkTo(e,spot.x,spot.y);
  if(!e.recall){ flash(e,'☕',3000); await wait(3500+Math.random()*2500); }
  await walkTo(e,e.chair.x,e.chair.y);
  e.wandering=false; e.recall=false;
}
async function recallDept(d){
  for(const e of deptEmps(d)) if(e.wandering) e.recall=true;
  // 상한 없이 기다리면 이동이 한 번 꼬였을 때 하루 전체가 멈춘다(진행률이 안 오른다)
  for(let i=0;i<40 && deptEmps(d).some(e=>e.wandering);i++) await wait(200);
  for(const e of deptEmps(d)) if(e.wandering){       // 끝내 안 돌아오면 자리로 되돌린다
    e.wandering=false; e.recall=false;
    e.x=e.chair.x; e.y=e.chair.y; e.path=[]; e.goal=null;
    if(e.resolver){ const r=e.resolver; e.resolver=null; r(); }
  }
}
function setDept(d,state){ for(const e of deptEmps(d)) e.state=state; }

/* ── 그리기 ── */
/* ── 팔레트 ── 구역별 바닥/벽 색. 단색 대신 명암 두 톤을 쓴다. */
const TINTS = {
  cor:    { base:'#8d8778', line:'#7d7869' },   // 복도
  room:   { base:'#b6ae9c', line:'#a79f8d' },   // 부서 방
  lounge: { base:'#93a487', line:'#84957a' },   // 라운지
  meet:   { base:'#a08fb4', line:'#9080a4' },   // 회의실
  ceo:    { base:'#b79f77', line:'#a8906a' },   // 대표실
};
const WALL = { face:'#413b33', top:'#5a5248', side:'#332e28' };
const WALL_H = 7;  // 벽 윗면 두께(px) — 살짝 위로 올려 입체로 보이게 한다

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.max(0, Math.min(255, Math.round(v + amt))));
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

function draw() {
  cx.clearRect(0, 0, COLS * TILE, ROWS * TILE);

  // ① 바닥 — 구역색 + 타일별 미세 편차 + 격자선
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!walk[y][x]) continue;
    const pal = TINTS[tint[y][x]] || TINTS.cor;
    cx.fillStyle = shade(pal.base, tileNoise(x, y) * 10);
    cx.fillRect(x * TILE, y * TILE, TILE, TILE);
    cx.strokeStyle = pal.line;
    cx.lineWidth = 1;
    cx.strokeRect(x * TILE + 0.5, y * TILE + 0.5, TILE - 1, TILE - 1);
  }

  // ② 벽 — 아래 그림자 → 정면 → 윗면 순으로 쌓아 두께를 만든다
  cx.fillStyle = 'rgba(0,0,0,.16)';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (walk[y][x] || furn.some(f => f.x === x && f.y === y)) continue;
    if (y + 1 < ROWS && walk[y + 1][x]) cx.fillRect(x * TILE, (y + 1) * TILE, TILE, 5);
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (walk[y][x]) continue;
    const f = furn.find(f => f.x === x && f.y === y);
    if (f) { drawFurniture(f); continue; }
    const px = x * TILE, py = y * TILE;
    cx.fillStyle = WALL.face;
    cx.fillRect(px, py, TILE, TILE);
    const openAbove = y > 0 && walk[y - 1][x];
    cx.fillStyle = WALL.top;
    cx.fillRect(px, py - (openAbove ? WALL_H : 0), TILE, openAbove ? WALL_H : 3);
    cx.fillStyle = WALL.side;
    cx.fillRect(px, py + TILE - 2, TILE, 2);
  }

  // ③ 출입구 매트
  const eg = cx.createLinearGradient(0, 22 * TILE, TILE, 24 * TILE);
  eg.addColorStop(0, '#d8b25a'); eg.addColorStop(1, '#c09638');
  cx.fillStyle = eg;
  cx.fillRect(0, 22 * TILE, TILE, 2 * TILE);

  // ④ 책상·의자
  for (const e of emps) drawWorkstation(e);

  // ⑤ 방 라벨 — 바닥 위에 옅게 새긴다
  cx.textAlign = 'center';
  cx.font = 'bold 13px "Malgun Gothic", sans-serif';
  for (let d = 0; d < DEPTS.length; d++) {
    const r = roomOf(d);
    cx.fillStyle = 'rgba(255,255,255,.30)';
    cx.fillText(DEPTS[d].short, r.label.x * TILE + TILE / 2, r.label.y * TILE + 1);
    cx.fillStyle = 'rgba(40,32,24,.50)';
    cx.fillText(DEPTS[d].short, r.label.x * TILE + TILE / 2, r.label.y * TILE);
  }
  cx.fillStyle = 'rgba(40,32,24,.45)';
  const zoneLabels = [['라운지', 7.5, 19.6], ['회의실', 30.5, 14.4], ['대표실', 53.5, 19.6]];
  for (const z of zoneLabels) cx.fillText(z[0], z[1] * TILE, z[2] * TILE);
  cx.save();
  cx.translate(11, 23 * TILE + 4); cx.rotate(-Math.PI / 2);
  cx.font = 'bold 10px "Malgun Gothic", sans-serif';
  cx.fillStyle = 'rgba(50,38,10,.75)'; cx.fillText('출입구', 0, 0);
  cx.restore();
  cx.textAlign = 'left';

  // ⑥ 승인 대기 — 회의실을 맥동시켜 시선을 끈다
  if (approvalGate) {
    const a = 0.35 + 0.25 * Math.sin(performance.now() / 320);
    cx.save();
    cx.strokeStyle = 'rgba(224,64,122,' + a + ')';
    cx.lineWidth = 4; cx.shadowColor = 'rgba(224,64,122,.7)'; cx.shadowBlur = 14;
    const hl = approvalGate.cfg.highlight === 'ceo'
      ? [46 * TILE, 12 * TILE, 15 * TILE, 10 * TILE]
      : [20 * TILE, 12 * TILE, 21 * TILE, 10 * TILE];
    cx.strokeRect(hl[0], hl[1], hl[2], hl[3]);
    cx.restore();
  }

  // ⑦ 인물 — y 순으로 그려 앞뒤가 겹치게
  drawPerson(CEO_SPOT.x, CEO_SPOT.y, 0, '#c9973f', '#f2c94c', '대표', true, true);
  const sorted = [...emps].filter(e => e.onsite || e.goal)
    .sort((a, b) => (a.y + a.seg) - (b.y + b.seg));
  for (const e of sorted) {
    let px = e.x, py = e.y;
    if (e.path.length) { px = e.x + (e.path[0].x - e.x) * e.seg; py = e.y + (e.path[0].y - e.y) * e.seg; }
    drawPerson(px, py, e.path.length ? performance.now() / 110 : 0,
               DEPTS[e.dept].color, STATES[e.state].color, e.n, e.sitting, false);
  }
  for (const e of sorted) if (e.bubble) drawBubble(e);
}

/** 가구 — 종류별로 형태를 다르게 그린다(회의탁자/대표 책상/커피바/화분). */
function drawFurniture(f) {
  const px = f.x * TILE, py = f.y * TILE;
  cx.fillStyle = 'rgba(0,0,0,.18)';
  cx.fillRect(px + 1, py + TILE - 3, TILE - 2, 4);
  if (f.k === 'table' || f.k === 'desk') {
    const g = cx.createLinearGradient(px, py, px, py + TILE);
    g.addColorStop(0, f.k === 'desk' ? '#a07a4e' : '#8d6a45');
    g.addColorStop(1, f.k === 'desk' ? '#7d5c39' : '#6d5133');
    cx.fillStyle = g;
    cx.fillRect(px, py + 2, TILE, TILE - 4);
    cx.strokeStyle = 'rgba(255,255,255,.14)'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(px, py + 3.5); cx.lineTo(px + TILE, py + 3.5); cx.stroke();
  } else if (f.k === 'coffee') {
    cx.fillStyle = '#4f4262';
    cx.fillRect(px + 1, py + 4, TILE - 2, TILE - 6);
    cx.fillStyle = '#e8e6e0';
    cx.font = '12px sans-serif'; cx.textAlign = 'center';
    cx.fillText('☕', px + TILE / 2, py + TILE - 5); cx.textAlign = 'left';
  } else {
    cx.fillStyle = '#8a5a3a';
    cx.fillRect(px + TILE / 2 - 4, py + TILE - 8, 8, 6);
    cx.fillStyle = '#3d7a3d';
    const leaves = [[-4, -3, 5], [4, -3, 5], [0, -7, 6]];
    for (const lf of leaves) {
      cx.beginPath(); cx.arc(px + TILE / 2 + lf[0], py + TILE / 2 + lf[1], lf[2], 0, 7); cx.fill();
    }
    cx.fillStyle = 'rgba(255,255,255,.12)';
    cx.beginPath(); cx.arc(px + TILE / 2 - 2, py + TILE / 2 - 8, 2.5, 0, 7); cx.fill();
  }
}

/** 자리 — 책상 + 모니터 + 등받이 의자. */
function drawWorkstation(e) {
  const d = e.desk, c = e.chair;
  const dx = d.x * TILE, dy = d.y * TILE;
  cx.fillStyle = 'rgba(0,0,0,.15)';
  cx.fillRect(dx + 1, dy + TILE - 4, TILE - 2, 4);
  const g = cx.createLinearGradient(dx, dy, dx, dy + TILE);
  g.addColorStop(0, '#9c7b52'); g.addColorStop(1, '#7a5e3d');
  cx.fillStyle = g;
  cx.fillRect(dx + 1, dy + 4, TILE - 2, TILE - 7);
  cx.fillStyle = '#2b3340';
  cx.fillRect(dx + 4, dy + 1, TILE - 8, 7);
  cx.fillStyle = DEPTS[e.dept].color;
  cx.globalAlpha = 0.55; cx.fillRect(dx + 5, dy + 2, TILE - 10, 5); cx.globalAlpha = 1;
  const cxp = c.x * TILE + TILE / 2, cyp = c.y * TILE + TILE / 2;
  cx.fillStyle = '#55483a';
  cx.beginPath();
  cx.ellipse(cxp, cyp + 2, TILE * 0.30, TILE * 0.24, 0, 0, 7);
  cx.fill();
  cx.fillStyle = '#6b5c49';
  cx.fillRect(cxp - TILE * 0.26, cyp - TILE * 0.30, TILE * 0.52, 3);
}

/** 인물 — 접지 그림자 + 몸통 그라디언트 + 머리/머리카락 + 상태 배지. */
function drawPerson(tx, ty, bobT, bodyC, ringC, label, sit, isCeo) {
  const x = tx * TILE + TILE / 2;
  const bob = bobT ? Math.sin(bobT) * 1.6 : 0;
  const y = ty * TILE + TILE / 2 + bob;

  cx.fillStyle = 'rgba(0,0,0,.28)';
  cx.beginPath();
  cx.ellipse(x, ty * TILE + TILE / 2 + 8, 7 - Math.abs(bob) * 0.5, 3, 0, 0, 7);
  cx.fill();

  const bh = sit ? 9 : 11;
  const g = cx.createLinearGradient(x, y - 3, x, y + bh);
  g.addColorStop(0, shade(bodyC, 26)); g.addColorStop(1, shade(bodyC, -22));
  cx.fillStyle = g;
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(x - 6.5, y - 3, 13, bh, [5, 5, 3, 3]);
  else cx.rect(x - 6.5, y - 3, 13, bh);
  cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.28)'; cx.lineWidth = 1; cx.stroke();

  cx.fillStyle = '#f0d0ae';
  cx.beginPath(); cx.arc(x, y - 7.5, 5, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.22)'; cx.stroke();
  cx.fillStyle = isCeo ? '#3a2f22' : '#33291f';
  cx.beginPath(); cx.arc(x, y - 8.6, 4.9, Math.PI * 1.03, Math.PI * 1.97); cx.fill();

  cx.fillStyle = ringC;
  cx.beginPath(); cx.arc(x + 6, y - 10, 3.1, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.lineWidth = 1; cx.stroke();

  // 축소 표시 중이면 이름을 생략한다 — 읽히지도 않으면서 화면만 지저분해진다
  if (dispScale() >= 0.55) {
    cx.font = '10px "Malgun Gothic", sans-serif';
    cx.textAlign = 'center';
    cx.lineWidth = 2.5; cx.strokeStyle = 'rgba(20,18,14,.72)';
    cx.strokeText(label, x, y + bh + 8);
    cx.fillStyle = '#fff';
    cx.fillText(label, x, y + bh + 8);
    cx.textAlign = 'left'; cx.lineWidth = 1;
  }
}

/** 말풍선 — 흰 카드 + 꼬리 + 그림자. 화면 밖으로 나가지 않게 클램프. */
function drawBubble(e) {
  let px = e.x, py = e.y;
  if (e.path.length) { px = e.x + (e.path[0].x - e.x) * e.seg; py = e.y + (e.path[0].y - e.y) * e.seg; }
  const bx = px * TILE + TILE / 2, byRaw = py * TILE - 16;
  cx.font = '11px "Malgun Gothic", sans-serif';
  const words = e.bubble.text, lines = [];
  for (let i = 0; i < words.length; i += 15) lines.push(words.slice(i, i + 15));
  const w = Math.max(...lines.map(l => cx.measureText(l).width)) + 16;
  const h = lines.length * 14 + 10;
  const x0 = Math.min(Math.max(bx - w / 2, 3), COLS * TILE - w - 3);
  const y0 = Math.max(byRaw - h, 3);

  cx.save();
  cx.shadowColor = 'rgba(0,0,0,.34)'; cx.shadowBlur = 7; cx.shadowOffsetY = 2;
  cx.fillStyle = 'rgba(255,255,255,.97)';
  cx.beginPath();
  if (cx.roundRect) cx.roundRect(x0, y0, w, h, 7); else cx.rect(x0, y0, w, h);
  cx.fill();
  cx.restore();
  cx.strokeStyle = 'rgba(0,0,0,.20)'; cx.lineWidth = 1; cx.stroke();

  cx.fillStyle = 'rgba(255,255,255,.97)';
  cx.beginPath();
  cx.moveTo(bx - 5, y0 + h - 1); cx.lineTo(bx + 5, y0 + h - 1); cx.lineTo(bx, y0 + h + 6);
  cx.fill();

  cx.fillStyle = '#20242e';
  lines.forEach((l, i) => cx.fillText(l, x0 + 8, y0 + 15 + i * 14));
}

/* ── 메인 루프 ──
   rAF는 패널이 화면에 없으면 정지해 시뮬레이션까지 멈추므로 setInterval로 돌린다. */
let lastT=performance.now();
function loop(){
  const t=performance.now();
  const dt=Math.min((t-lastT)/1000,.1); lastT=t;
  if(!paused){
    for(let i=pendWaits.length-1;i>=0;i--){ pendWaits[i].left-=dt*1000*speed;
      if(pendWaits[i].left<=0){ pendWaits[i].res(); pendWaits.splice(i,1); } }
    updateEmps(dt); wanderAI(dt);
    if(dayStarted&&!dayDone) simMin+=dt*speed*2;
  }
  draw(); refreshUI();
}

/* ── 회의 헬퍼 ── */
async function meeting(names,lines){
  // 이름이 하나라도 없으면 아래에서 undefined 를 건드려 코루틴이 통째로 죽는다.
  // 화면은 그 단계에서 영원히 멈춘 것처럼 보이므로, 여기서 걸러 원인을 남긴다.
  const missing=names.filter(n=>!E(n));
  if(missing.length){ addMsg('시스템',`회의 소집 실패 — 없는 직원: ${missing.join(', ')}`); return; }
  const ms=names.slice(0,MEET_SEATS.length).map((n,i)=>({e:E(n),seat:MEET_SEATS[i]}));
  for(const m of ms){ m.e.inMeeting=true; if(m.e.wandering) m.e.recall=true; }
  await Promise.all(ms.map(m=>walkTo(m.e,m.seat.x,m.seat.y)));
  for(const [n,t] of lines){ await say(E(n),t,2800); }
  await Promise.all(ms.map(m=>walkTo(m.e,m.e.chair.x,m.e.chair.y)));
  for(const m of ms) m.e.inMeeting=false;
}
async function handoff(fromName,toDept,text){
  const e=E(fromName), d=roomOf(toDept).door;
  await walkTo(e,d.x,d.y); await say(e,text,2200); await walkTo(e,e.chair.x,e.chair.y);
}

let projectIdx = 0;       // 오늘 볼 저장소. 하루가 끝나면 다음으로 넘어간다
let scannedRepos = [];    // 후보가 없는 것 포함, 스캔한 저장소 이름

/** 실제 산출물에서 뽑은 후보를 읽어온다.
 *  src/report/discover.py 가 리포트·repeat_eval 을 파싱해 만든 파일이다.
 *  못 읽으면 내장 예시로 폴백하되, 화면에 '예시'라고 표시한다. */
async function loadCandidates() {
  try {
    // 임베드(iframe srcdoc)에서는 상대경로 fetch 가 동작하지 않는다.
    // 호스트가 window.__CANDIDATES 로 주입해 주면 그것을 먼저 쓴다.
    let d = window.__CANDIDATES;
    if (!d) {
      const res = await fetch('candidates.json', { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      d = await res.json();
    }
    planProjects = Array.isArray(d.projects) && d.projects.length
      ? d.projects
      : (d.A || d.B ? [{ project: d.project, A: d.A || [], B: d.B || [] }] : []);
    scannedRepos = d.scanned_repos || planProjects.map(p => p.project && p.project.name);
    if (!planProjects.length) throw new Error('후보 0개');
    projectIdx = projectIdx % planProjects.length;
    const cur = planProjects[projectIdx];
    // 후보가 없는 모드는 내장 예시를 남겨 화면이 비지 않게 한다
    PLAN_POOL.A = cur.A.length ? cur.A : PLAN_POOL.A;
    PLAN_POOL.B = cur.B.length ? cur.B : PLAN_POOL.B;
    planProject = cur.project || null;
    planSource = { kind:'실측', detail:`${d.source_report} · ${d.generated.slice(0,16)}`,
                   blanks: d.blanks_for_owner || [] };
    addMsg('도서진', `저장소 ${scannedRepos.length}개 스캔 완료, 후보가 있는 곳 ${planProjects.length}개. ` +
                     `오늘 볼 곳: ${planProject ? planProject.name : '(미상)'} (${projectIdx+1}/${planProjects.length})`);
  } catch (e) {
    planSource = { kind:'예시', detail:`candidates.json 로드 실패(${e.message}) — 내장 예시로 진행` };
  }
  const el = document.getElementById('planSrc');
  if (el) {
    const nth = planProjects.length > 1 ? ` (${projectIdx+1}/${planProjects.length})` : '';
    const proj = planProject
      ? `<b>대상 프로젝트: ${planProject.name}${nth}</b>` +
        (planProject.commit ? ` <span style="opacity:.7">@${planProject.commit}</span>` : '') + '<br>'
      : '';
    el.innerHTML = proj + (planSource.kind === '실측'
      ? `후보 출처: 실측 · ${planSource.detail}`
      : `후보 출처: ${planSource.detail}`);
    el.className = planSource.kind === '실측' ? 'srcReal' : 'srcDemo';
  }
}

/* ── 승인 게이트 (범용) ──
   사규 ⑪만이 아니라 기획 채택에서도 쓴다. 참석자를 회의실/대표실에 앉히고,
   패널을 1회 그린 뒤, 대표가 누를 때까지 await 한다.
   반환: {action, pick} — pick 은 선택 카드가 있을 때만 채워진다. */
async function requestApproval(cfg) {
  const seats = cfg.seats || [];
  for (const n of seats) { E(n).inMeeting = true; E(n).state = '승인 대기'; }
  if (seats.length)
    await Promise.all(seats.map((n, i) => walkTo(E(n), MEET_SEATS[i].x, MEET_SEATS[i].y)));
  for (const n of seats) E(n).bubble = { text: cfg.bubble || '확인해주세요', until: Infinity };

  // 패널 1회 렌더
  document.getElementById('approvalTitle').innerHTML =
    `${cfg.title} <span id="approvalTimer" style="color:#c9a0bb"></span>`;
  const cbox = document.getElementById('approvalChoices');
  cbox.innerHTML = (cfg.choices || []).map((c, i) =>
    `<div class="choice" data-i="${i}"><b>${c.label}</b><br><span>${c.note}</span>` +
    (c.action ? `<br><span class="doWhat">채택 시 → ${c.action}</span>` : '') +
    (c.source ? `<br><span style="color:#7f93a8">출처 ${c.source}</span>` : '') +
    `</div>`).join('');
  const bbox = document.getElementById('approvalBtns');
  bbox.innerHTML = cfg.options.map(o =>
    `<button data-act="${o.id}" class="${o.cls || ''}">${o.label}</button>`).join('');
  document.getElementById('approvalBox').classList.add('show');
  document.body.classList.add('gate');

  const res = await new Promise(resolve => {
    approvalGate = { cfg, resolve, since: performance.now(), pick: null };
    syncGateButtons();   // 게이트가 설정된 뒤라야 잠금이 계산된다
  });

  approvalGate = null;
  document.getElementById('approvalBox').classList.remove('show');
  document.body.classList.remove('gate');
  cbox.innerHTML = ''; bbox.innerHTML = '';
  for (const n of seats) E(n).bubble = null;
  decisions.push({ title: cfg.title, action: res.action });
  addMsg('대표', `[${res.action}]` + (res.pick ? ` ${res.pick.label}` : ''), true);
  return res;
}

/** 카드가 있는 게이트는 하나를 고르기 전까지 확정 버튼을 잠근다. */
function syncGateButtons() {
  if (!approvalGate) return;
  const need = (approvalGate.cfg.choices || []).length > 0;
  for (const b of document.querySelectorAll('#approvalBtns button')) {
    const opt = approvalGate.cfg.options.find(o => o.id === b.dataset.act);
    b.disabled = need && opt && opt.needsPick && approvalGate.pick === null;
  }
}

/* ── 프롤로그 — 모드 A/B 공통 골격 ──
   반환: 채택된 과제 ctx, 또는 null(전부 반려 → 오늘 착수 없음). */
async function runPrologue(my) {
  const isA = mode === 'A';
  // 발굴팀장이 주재하고, 관점이 다른 팀장 3명이 함께 모인다.
  // 발굴팀 단독으로 정하면 '어느 파일에 있나'만 보게 되고, 관점 팀장만 모이면
  // 각자 자기 팀 관심사로 기운다 — 그래서 넷이 같이 앉는다.
  const host = '예지완';
  const perspectives = isA ? ['한지훈','정해린','윤도경'] : ['최시온','강태섭','문상우'];
  const teams = [host, ...perspectives];

  step('pScan');
  setDept(12,'진행 중'); setDept(10,'진행 중'); await recallDept(12); await recallDept(10);
  await say(E('도서진'), isA ? '보유 산출물 목록 뽑았습니다.' : '이월 대장 꺼냈습니다 — 미측정·이관 항목요.');
  await say(E('예지완'), '그거 어느 파일에 적혀 있습니까?', 2200);
  await handoff('도서진', 10, '재현성팀에 지문 대조 요청합니다.');
  await say(E('문상우'), '대조했습니다. 이 목록이 지금 회사가 가진 전부예요.');
  setDept(10,'완료');
  if (my !== dayEpoch) return null;

  step('pIdeate');
  addMsg('시스템', isA ? '기획 회의 — 과제발굴팀장 주재, 요구정의·EDA·모델링 팀장이 각자 과제를 냅니다.'
                       : '회고 회의 — 과제발굴팀장 주재, 검수 3팀장이 개선 과제를 냅니다.');
  // 후보 수는 저장소마다 다르다(0~3). 3개를 전제하면 pool[i] 가 undefined 가 되어
  // 회의 도중 예외가 나고, 코루틴이 조용히 죽어 화면이 이 단계에서 멈춘다.
  const pool = PLAN_POOL[isA ? 'A' : 'B'] || [];
  if (!pool.length) {
    await say(E(host), '근거가 남은 항목이 없습니다. 오늘은 올릴 후보가 없어요.', 3000);
    return null;                       // 후보 0개 — 지어내지 않고 하루를 접는다
  }
  const speakers = perspectives.slice(0, pool.length);
  await meeting([host, ...speakers], [
    [host, isA ? `대장에 적힌 것만 올립니다. 오늘은 ${pool.length}건입니다.`
               : `스스로 미측정이라 적은 것만 봅니다. 오늘은 ${pool.length}건입니다.`],
    ...speakers.map((n, i) => [n, pool[i].label]),
  ]);
  if (my !== dayEpoch) return null;

  step('pFilter');
  await say(E(isA ? '한지훈' : '최시온'),
            isA ? '셋 다 결정 사항이 있습니다. 통과.' : '셋 다 예상 델타를 씁니다. 통과.');
  await say(E(host), '근거 파일 경로도 셋 다 붙었습니다.', 2200);
  setDept(12,'완료');
  if (my !== dayEpoch) return null;

  step('pAdopt');
  addMsg('시스템','대표 채택이 필요합니다 — 3안 중 1개를 고르거나 전부 반려하세요.');
  const r = await requestApproval({
    title: (isA ? '★ 기획 채택 대기' : '★ 개선 과제 채택 대기')
           + ` · ${planProject ? planProject.name : '대상 미상'} [${planSource.kind}] —`,
    seats: teams, highlight:'meet', bubble:'골라주세요',
    choices: pool,
    options: [{ id:'채택', label:'채택', cls:'btnOk', needsPick:true },
              { id:'전부 반려', label:'전부 반려' }],
  });
  if (my !== dayEpoch) return null;
  for (const n of teams) { E(n).state='완료'; E(n).inMeeting=false; walkTo(E(n), E(n).chair.x, E(n).chair.y); }

  if (r.action !== '채택' || !r.pick) {
    addMsg('유하람','전부 반려되어 오늘은 착수하지 않습니다. 내일 다시 기획하겠습니다.');
    return null;
  }
  addMsg('유하람', `채택: ${r.pick.label}`);
  emitWorkOrder(r.pick, isA);
  return r.pick;
}

/** 채택 결과를 '작업 지시서'로 남긴다.
 *  이 화면은 코드를 고치지 못한다. 그러므로 채택의 산출물은 **사람이 복사해
 *  실제 작업 세션에 붙여넣을 수 있는 텍스트**여야 한다. 그래야 채택이
 *  화면 안에서 끝나지 않는다. */
function emitWorkOrder(pick, isA) {
  const proj = planProject ? planProject.name : '(대상 미상)';
  const at = planProject && planProject.commit ? ` @${planProject.commit}` : '';
  // note 가 이미 '근거:' 로 시작한다 — 접두어를 또 붙이면 "근거: 근거:" 가 된다
  const note = String(pick.note || '').replace(/^\s*근거:\s*/, '');
  // 빈칸은 후보마다 다르다. 저장소 재개 여부에 '오탐:미탐 비용비'를 물으면 안 된다
  const blanks = (pick.blanks || []).map(b => `  - [ ] ${b}`).join('\n');
  const order =
`[작업 지시서] ${proj}${at}
모드: ${isA ? 'A · 신규 기획' : 'B · 기존 디벨롭'} · 후보 출처: ${planSource.kind}
과제: ${pick.label}
할 일: ${pick.action || '(미정)'}
근거: ${note}
출처: ${pick.source || '(없음)'}` + (blanks ? `\n대표가 정할 것:\n${blanks}` : '');

  // 지시창에는 두 줄만. 전체는 '지시서' 버튼으로 꺼낸다 — 매번 긴 블록이 뜨면 소음이다
  addMsg('예지완', `${pick.label} → ${pick.action || '(할 일 미정)'}`);
  window.__lastWorkOrder = order;
}

/* ── 하루 시나리오 (사규 §9) ── */
/** runDay 래퍼 — 코루틴이 예외로 죽으면 화면은 '멈춘 것처럼' 보일 뿐 아무 표시가 없다.
 *  여기서 붙잡아 지시창에 남기고 하루를 정리한다. */
function startDay(){
  runDay().catch(err => {
    console.error(err);
    addMsg('시스템', `오류로 하루가 중단됐습니다 — ${err && err.message ? err.message : err}`);
    dayDone = true;
    setTimeout(resetDay, 15000);
  });
}

/* ── 다음 날 리셋 — reload는 미리보기/아티팩트 컨텍스트에서 막힐 수 있어 상태만 초기화한다 ── */
function resetDay(){
  dayEpoch++;                                   // 이전 날 코루틴 무효화
  for(const w of pendWaits) w.res();            // 버리지 않고 해제 — 버리면 영원히 멈춘다
  pendWaits.length=0;
  if(approvalGate){                             // 게이트가 열린 채 리셋되면 코루틴이 영구 정지
    const g=approvalGate; approvalGate=null;
    document.getElementById('approvalBox').classList.remove('show');
    document.body.classList.remove('gate');
    g.resolve({action:'중단',pick:null});
  }
  dayStarted=false; dayDone=false; curStep=-1; simMin=9*60;
  rejectCount=0; decisionMade=null; dataWaitMsg=null; decisions=[]; ctx=null;
  if(nextMode){ mode=nextMode; nextMode=null; }   // 예약된 모드는 다음 날부터 적용
  if(planProjects.length) projectIdx=(projectIdx+1)%planProjects.length;  // 내일은 다음 저장소
  steps=(mode==='F'?[]:PROLOGUE_STEPS[mode]).concat(CORE_STEPS);
  for(const e of emps) Object.assign(e,{x:ENTRY.x,y:ENTRY.y,path:[],seg:0,state:'대기',onsite:false,
    sitting:false,inMeeting:false,wandering:false,recall:false,bubble:null,goal:null,resolver:null,stuck:0});
  const b=document.getElementById('btnStart'); b.disabled=false; b.textContent='하루 시작';
  document.getElementById('btnPause').disabled=true;
  addMsg('시스템','── 다음 날 ── 3초 후 자동 출근합니다.');
  setTimeout(startDay,3000);
}

/* ── 대표 지시창 (사규 §10) ── */
function bottleneckAnswer(){
  if(approvalGate){
    const sec=Math.floor((performance.now()-approvalGate.since)/1000);
    return `원인은 하나예요 — 대표님 결재 대기입니다. 회의실에서 3명이 ${sec}초째 기다리고 있어요. 승인만 눌러주시면 바로 다음 단계로 넘어갑니다.`;
  }
  if(dataWaitMsg) return `${dataWaitMsg}입니다. 스냅샷이 도착하면 자동으로 풀립니다.`;
  if(!dayStarted) return `아직 출근 전입니다. '하루 시작'을 눌러주세요.`;
  if(dayDone) return `지연 없습니다.`;
  if(curStep>=0){ const active=DEPTS.findIndex((_,i)=>deptEmps(i).some(e=>e.state==='진행 중'));
    const name=active>=0?DEPTS[active].name:'현재 단계';
    return `${name} 작업 중 — 진행률 ${curStep+1}/${steps.length}. 정상 속도입니다.`; }
  return `지연 없습니다.`;
}

  const t=q.replace(/\s/g,'');
  if(t.includes('현황')){
    const cur=curStep<0?'출근 전':curStep>=steps.length?'종료':stepLabel(curStep);
    const nxt=curStep+1<steps.length?stepLabel(curStep+1):'퇴근';
    addMsg('유하람',`현재 ${document.getElementById('clock').textContent} · 단계 ${Math.max(curStep+1,0)}/${steps.length} — ${cur}. 다음은 ${nxt}입니다.`);
    return; }
  if(t.includes('왜')&&(t.includes('막')||t.includes('늦'))){ addMsg('유하람',bottleneckAnswer()); return; }
  if(t.includes('지시서')||t.includes('작업지시')){
    if(window.__lastWorkOrder){ addMsg('예지완', window.__lastWorkOrder, false, true); }
    else addMsg('예지완','아직 채택된 과제가 없습니다. 채택 후에 지시서가 나옵니다.');
    return; }
  if(t.includes('저장소목록')||t.includes('저장소리스트')||t.includes('전체저장소')){
    if(!planProjects.length){ addMsg('예지완','아직 스캔 결과를 못 읽었습니다.'); return; }
    addMsg('예지완', `스캔 ${scannedRepos.length}개 · 후보 있는 곳 ${planProjects.length}개\n` +
      planProjects.map((p,i)=>`${i===projectIdx?'▶':' '} ${p.project.name} — 신규 ${p.A.length} / 개선 ${p.B.length}`).join('\n'),
      false, true);
    return; }
  const jump = planProjects.findIndex(p=>p.project && t.includes(p.project.name.replace(/[-_]/g,'')));
  if(jump>=0 && (t.includes('보자')||t.includes('전환')||t.includes('바꿔'))){
    if(dayStarted&&!dayDone){ addMsg('유하람','하루 중간 전환은 안 합니다. 내일 이 저장소부터 봅니다.');
      projectIdx=(jump-1+planProjects.length)%planProjects.length; return; }
    projectIdx=jump; loadCandidates();
    addMsg('예지완',`${planProjects[jump].project.name} 로 바꿨습니다.`); return; }
  if(t.includes('프로젝트')||t.includes('대상')){
    addMsg('예지완', planProject
      ? `대상은 ${planProject.name}${planProject.commit?' @'+planProject.commit:''} 하나입니다. ` +
        `${planProject.remote||''} · 근거 리포트 ${planSource.detail}`
      : '대상 프로젝트를 아직 못 읽었습니다. candidates.json 을 로드해야 합니다.');
    return; }
  if(t.includes('후보')||t.includes('근거출처')||t.includes('대장')){
    addMsg('예지완', planSource.kind==='실측'
      ? `실측입니다. ${planSource.detail} 에서 뽑았습니다. 지어낸 후보는 없습니다.`
      : `지금은 예시입니다 — ${planSource.detail}. 실측을 보시려면 discover.py 를 돌리고 웹서버로 여세요.`);
    return; }
  if(t.includes('수치')||t.includes('어디서')){
    addMsg('문상우',`data/models/comparison.json (2026-07-01 17:14, sha256 87522ad05634)에서 나왔습니다. 재현: python -m src.report.daily_report --check`);
    return; }
  if(t.includes('한계')||t.includes('근거')){
    addMsg('임세아',`결함모드별 재현율 원표입니다 — 완전 미탐: IDV 3(0.00)·IDV 18(0.00) / 취약: IDV 2(0.79)·8(0.71)·12(0.56) / 완전 탐지: IDV 4·6·7·14(1.00). 출처 comparison.json.`);
    return; }
  if(t.includes('검수소집')||t.includes('회의소집')){
    if(approvalGate){ addMsg('유하람','지금은 결재가 진행 중입니다. 그것부터 부탁드려요.'); return; }
    if(!dayStarted){ addMsg('유하람','출근 전이라 소집이 어렵습니다.'); return; }
    if(sideBusy){ addMsg('유하람','이미 회의 중입니다.'); return; }
    sideBusy=true; inspectionMeeting().finally(()=>sideBusy=false); return; }
  if(t.includes('집중')){
    let n=0; for(const e of emps) if(e.wandering){ e.recall=true; n++; }
    addMsg('유하람',n?`라운지의 ${n}명을 자리로 복귀시켰습니다.`:'전원 자리에 있습니다.'); return; }
  if(t.includes('모드')||t.includes('기획')||t.includes('디벨롭')){
    const want = t.includes('A')||t.includes('신규') ? 'A'
               : t.includes('B')||t.includes('디벨롭')||t.includes('개선') ? 'B'
               : t.includes('고정')||t.includes('대본') ? 'F' : null;
    if(!want){ addMsg('유하람',`현재 ${MODE_LABEL[mode]}입니다. "모드 B로" 처럼 말씀해주세요.`); return; }
    if(!dayStarted||dayDone){ mode=want; nextMode=null;
      steps=(mode==='F'?[]:PROLOGUE_STEPS[mode]).concat(CORE_STEPS);
      addMsg('유하람',`${MODE_LABEL[want]}로 바꿨습니다.`); return; }
    nextMode=want;
    addMsg('유하람',`하루 중간 전환은 안 합니다. 내일부터 ${MODE_LABEL[want]}로 예약했습니다.`); return; }
  for(let d=0;d<DEPTS.length;d++){
    if(t.includes(DEPTS[d].name.replace(/\s/g,''))||t.includes(DEPTS[d].short)){
      const lead=deptEmps(d).find(e=>e.lead), mem=deptEmps(d);
      addMsg(lead.n,`${DEPTS[d].name} 현황: `+mem.map(e=>`${e.n} ${e.wandering?'라운지☕':e.state}`).join(' · ')+`. "${lead.buzz}"`);
      return; } }
  const who=emps.find(e=>t.includes(e.n)||t.includes(e.c));
  if(who){ addMsg(who.n,`지금 ${who.wandering?'라운지에서 커피 마시는 중입니다':who.state+' 상태입니다'}. "${who.buzz}"`); return; }
  addMsg('유하람','질문을 못 알아들었어요. "현황 보고" / "왜 막혔어?" / "검수 소집" / 부서명이나 직원 이름으로 물어보세요.');
}

/* ── 자동 시작 — 시작은 자동, 멈추는 곳은 ⑪ 대표 승인뿐 ── */
let autoLeft=5;
const autoTimer=setInterval(()=>{
  if(dayStarted){ clearInterval(autoTimer); return; }
  autoLeft--;
  if(autoLeft<=0){ clearInterval(autoTimer); document.getElementById('btnStart').textContent='하루 시작'; startDay(); }
  else document.getElementById('btnStart').textContent=`하루 시작 (${autoLeft}초 후 자동)`;
},1000);

/* ── 이벤트 ── */
document.getElementById('btnStart').onclick=()=>{ clearInterval(autoTimer); startDay(); };
document.getElementById('btnPause').onclick=function(){ paused=!paused; this.textContent=paused?'재개':'일시정지'; };
document.querySelectorAll('.spd').forEach(b=>b.onclick=function(){
  speed=+this.dataset.s;
  document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('speedOn',x===this)); });
// 게이트마다 버튼·카드가 달라지므로 ID 바인딩 대신 위임으로 받는다
document.getElementById('approvalBtns').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b||!approvalGate||b.disabled) return;
  const g=approvalGate; approvalGate=null;
  g.resolve({action:b.dataset.act, pick:g.pick});
});
document.getElementById('approvalChoices').addEventListener('click',ev=>{
  const c=ev.target.closest('.choice'); if(!c||!approvalGate) return;
  for(const el of document.querySelectorAll('#approvalChoices .choice')) el.classList.remove('sel');
  c.classList.add('sel');
  approvalGate.pick=approvalGate.cfg.choices[+c.dataset.i];
  syncGateButtons();
});
document.querySelectorAll('#quickBtns button').forEach(b=>b.onclick=()=>handleCommand(b.dataset.q));
document.getElementById('btnSend').onclick=()=>{ const i=document.getElementById('cmdInput'); handleCommand(i.value); i.value=''; };
document.getElementById('cmdInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ handleCommand(e.target.value); e.target.value=''; } });

/* ── 초기화 ── */
buildMap(); buildEmps();
addMsg('유하람','사규 34명 편성으로 대기 중입니다. 5초 후 자동 출근합니다 — ⑪ 대표 승인에서만 기다릴게요.');
document.getElementById('btnStart').textContent='하루 시작 (5초 후 자동)';
setInterval(loop,33);
</script>
</body>
